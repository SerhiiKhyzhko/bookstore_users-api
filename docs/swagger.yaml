definitions:
  user_errors.SwaggerRestErr:
    properties:
      error:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  users.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  users.PartialUser:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      status:
        type: string
    type: object
  users.PrivateUser:
    properties:
      date_creating:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      status:
        type: string
    type: object
  users.User:
    properties:
      date_creating:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      password:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /internal/users/search:
    get:
      consumes:
      - application/json
      description: |-
        Returns an array of users If X-Public header is true return 'public user' with
        the most common fields. If X-Public header is false return 'private user' with all fields accept password
      parameters:
      - description: search request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/users.User'
            type: array
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
      summary: Search users
      tags:
      - users
  /users:
    post:
      consumes:
      - application/json
      description: |-
        Create new user with provided informtion. If X-Public header is true return 'public user' with
        the most common fields. If X-Public header is false return 'private user' with all fields accept password
      parameters:
      - description: User request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/users.PrivateUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
      summary: Create new user
      tags:
      - users
  /users/{id}:
    delete:
      description: Delete an user using id obtained via URL
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
      summary: Delete user
      tags:
      - users
    get:
      description: |-
        Return user using id obtained via URL and access token. If X-Public header is true return 'public user' with
        the most common fields. If X-Public header is false return 'private user' with all fields accept password
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: string
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.PrivateUser'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
      summary: Get user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Update the user with provided informtion. If X-Public header is true return 'public user' with
        the most common fields. If X-Public header is false return 'private user' with all fields accept password
      parameters:
      - description: update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.PartialUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.PrivateUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
      summary: Partially update user fields
      tags:
      - users
    put:
      consumes:
      - application/json
      description: |-
        Update user with provided informtion. If X-Public header is true return 'public user' with
        the most common fields. If X-Public header is false return 'private user' with all fields accept password
      parameters:
      - description: update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.PrivateUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
      summary: Replace entire user
      tags:
      - users
  /users/login:
    post:
      consumes:
      - application/json
      description: |-
        Returns user specific user whitch match given email and password. If X-Public
        header is true return 'public user' with the most common fields. If X-Public header
        is false return 'private user' with all fields accept password
      parameters:
      - description: Log in request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.PrivateUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user_errors.SwaggerRestErr'
      summary: Log in user
      tags:
      - users
swagger: "2.0"
